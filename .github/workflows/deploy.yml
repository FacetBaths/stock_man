name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize version allocation through deployment and tag publication.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        run: cd frontend && npm ci
        
      - name: Select next release version
        id: version
        run: node scripts/release-version.js

      - name: Test release versioning
        run: npm run test:release
        
      - name: Build
        run: cd frontend && npm run build-only
        env:
          NODE_ENV: production
          GITHUB_PAGES_CUSTOM_DOMAIN: true
          VITE_API_URL: https://stockman-production-e4e4.up.railway.app/api
          VITE_APP_VERSION: ${{ env.NEW_VERSION }}
          
      - name: Verify build output
        run: |
          echo "Build output contents:"
          ls -la frontend/dist/
          echo "CNAME file contents:"
          cat frontend/dist/CNAME || echo "CNAME file not found"
          echo "Index.html exists:"
          ls -la frontend/dist/index.html || echo "index.html not found"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: write   # Persist the deployed version as a release tag
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployed version
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "v${RELEASE_VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/v${RELEASE_VERSION}"
